name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -m "not tf"

  tensorflow:
    name: LSTM tests (TensorFlow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,tf]"
      - run: pytest -m tf
      - name: End-to-end demo with the LSTM primary model
        run: >
          sysml demo
          --set primary.type=lstm
          --set primary.cv_splits=2
          --set primary.lstm.epochs_cv=2
          --set primary.lstm.epochs_final=2
          --set primary.lstm.units1=16
          --set primary.lstm.units2=8
          --set output_dir=/tmp/sysml_ci
