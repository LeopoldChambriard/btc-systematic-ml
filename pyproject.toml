[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-systematic-ml"
version = "0.1.0"
description = "Leakage-aware systematic trading research pipeline on BTC: regime features, trend-scanning labels, LSTM + meta-labeling, clustered feature importance and a cost-aware backtest."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Léopold Chambriard" }]
keywords = ["quantitative-finance", "systematic-trading", "machine-learning", "meta-labeling", "bitcoin", "lstm", "hmm"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The LSTM primary model needs TensorFlow. The logistic-regression primary model
# (model.primary.type = "logreg") runs without it.
tf = ["tensorflow>=2.16"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/LeopoldChambriard/btc-systematic-ml"
Issues = "https://github.com/LeopoldChambriard/btc-systematic-ml/issues"

[project.scripts]
sysml = "sysml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "tf: needs TensorFlow (deselect with -m 'not tf')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]  # the archived coursework notebook is kept as-is

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "NPY"]
ignore = ["E731", "B905"]
